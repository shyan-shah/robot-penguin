[env:esp32-s3-devkitc-1]
; The BOM specifies an ESP32-S3 DevKitC-1 N8R8 (8 MB flash, 8 MB octal PSRAM).
; This used to say board = esp32dev, which is a different chip with a different
; GPIO map - see the pin note in src/main.cpp.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4

; Motion tables are generated - regenerate before building if the sim changed:
;   python ../export_motions.py
