; Robot penguin firmware. TWO BOARDS are supported - see the pin note at the
; top of src/main.cpp for why, and for the GPIO maps.
;
;   esp32-s3-devkitc-1   The board the BOM specifies (8 MB flash, 8 MB octal
;                        PSRAM). The PSRAM is needed only for the optional
;                        on-device language model, which is not built yet.
;   esp32dev             A classic ESP32 DevKitC (WROOM-32). Runs this firmware
;                        unchanged: it needs seven PWM outputs and an I2C pair,
;                        allocates nothing from PSRAM, and owns no audio.
;
; Build and upload a specific board:
;   pio run -e esp32dev -t upload
;   pio run -e esp32-s3-devkitc-1 -t upload
;
; The default is the S3, to match the BOM.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4

; Motion tables are generated - regenerate before building if the sim changed:
;   python ../export_motions.py

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

[env:esp32dev]
board = esp32dev
; A classic DevKitC has 4 MB of flash, and the default partition table gives the
; app only 1.31 MB. This binary is 1.35 MB, so the stock layout overflows by
; 72 KB. huge_app gives the app 3 MB and still leaves an 896 KB filesystem for
; /learned.bin, which needs about 17 KB. The cost is OTA, which this firmware
; does not use - it is flashed over USB.
board_build.partitions = huge_app.csv
